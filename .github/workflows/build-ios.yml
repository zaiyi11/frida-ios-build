name: build-frida-ios

# 在 GitHub 的 macOS runner(自带 Xcode + iOS SDK)上原生编 iOS 版 frida。
# 手动触发:Actions 页 -> build-frida-ios -> Run workflow。

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "frida 版本(要和你主机 client 对齐)"
        default: "16.1.4"
      arch:
        description: "iOS 架构(6s/A9=arm64;A12+=arm64e)"
        default: "arm64"

jobs:
  build:
    runs-on: macos-14            # 关键:macOS runner 自带 Apple 工具链
    timeout-minutes: 120
    steps:
      - name: 拉取 frida 源码(含子模块)
        run: |
          git clone --recurse-submodules --depth 1 \
            -b "${{ github.event.inputs.frida_version }}" \
            https://github.com/frida/frida.git frida

      - name: 反检测改名(源码级,version-robust)
        run: |
          cd frida
          # 干掉 isGumjsThreadExist:重命名 gum-js-loop 线程(frida 自设自用,改名安全)
          grep -rlZ --include=*.c --include=*.cpp --include=*.vala 'gum-js-loop' . \
            | xargs -0 -r sed -i '' 's/gum-js-loop/gmain-loop/g' || true
          echo "改名完成;端口 27042 走运行时 -l 规避,文件路径 /usr/sbin/frida-server 靠安装位置规避"
          # 可选(首次先不开,避免破坏协议):re.frida.server / frida:rpc / frida-agent 改名

      - name: 编译 frida-server (iOS arm64)
        run: |
          cd frida
          # frida 16.1.4 用 Makefile target,core-ios = iOS arm64(对 6s/A9)
          make core-ios
          echo "== 定位产物 =="
          find build -name frida-server -type f -print

      - name: ldid 签越狱调试权限
        run: |
          brew install ldid || true
          BIN=$(find frida/build -name frida-server -type f | head -1)
          echo "server=$BIN"
          ldid -S"${{ github.workspace }}/ent.plist" "$BIN"
          cp "$BIN" "frida-server-ios-${{ github.event.inputs.arch }}"
          ls -l "frida-server-ios-${{ github.event.inputs.arch }}"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-ios-${{ github.event.inputs.arch }}
          path: frida-server-ios-${{ github.event.inputs.arch }}
