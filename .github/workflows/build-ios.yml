name: build-frida-ios

# 在 GitHub 的 macOS runner(自带 Xcode + iOS SDK)上原生编 iOS 版 frida。
# 手动触发:Actions 页 -> build-frida-ios -> Run workflow。

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "frida 版本(要和你主机 client 对齐)"
        default: "16.1.4"
      arch:
        description: "iOS 架构(6s/A9=arm64;A12+=arm64e)"
        default: "arm64"

jobs:
  build:
    runs-on: macos-14            # 秒被领取(macos-13 免费机稀缺常排队 15min+)
    timeout-minutes: 120
    steps:
      - name: Checkout 本仓库(取 ent.plist)
        uses: actions/checkout@v4

      - name: 拉取 frida 源码(含子模块)
        run: |
          git clone --recurse-submodules --depth 1 \
            -b "${{ github.event.inputs.frida_version }}" \
            https://github.com/frida/frida.git frida

      - name: 降级 clang16 默认错误(frida16.1.4 是 2023 代码,clang16 把这些当 error)
        run: |
          cd frida
          # setup-env.sh 无 CFLAGS 钩子,直接往 c_like_flags 注入 -Wno-error=*
          perl -0777 -i -pe 's/(c_like_flags=\(\))/$1\nc_like_flags+=("-Wno-error=incompatible-function-pointer-types" "-Wno-error=incompatible-pointer-types" "-Wno-error=int-conversion" "-Wno-error=implicit-function-declaration" "-Wno-error=implicit-int")/' releng/setup-env.sh
          grep -n 'Wno-error' releng/setup-env.sh || (echo "注入失败"; exit 1)

      - name: 编译 frida-server (iOS arm64)
        env:
          IOS_CERTID: "-"        # ad-hoc 签名(runner 无 Apple 证书;越狱机可用)
        run: |
          cd frida
          # frida 16.1.4 用 Makefile target,core-ios = iOS arm64(对 6s/A9)
          make core-ios
          echo "== 定位产物 =="
          find build -name frida-server -type f -print
          find build -name 'frida-agent.dylib' -type f -print

      - name: 去特征(undetected-frida 式:编译后二进制 patch,版本无关无 hunk 风险)
        run: |
          SRV=$(find frida/build -name frida-server -type f | head -1)
          AG=$(find frida/build -name 'frida-agent.dylib' -type f | head -1)
          echo "server=$SRV"; echo "agent=$AG"
          [ -n "$SRV" ] && [ -n "$AG" ] || { echo "产物缺失"; exit 1; }
          # 反转 gum-js-loop/gmain/gdbus/GumScript/GDBusProxy/GLib-GIO/FridaScriptEngine + frida->frlda
          python3 "${{ github.workspace }}/postpatch.py" "$SRV" "$AG"
          echo "== agent 特征残留校验(应全 0)=="
          for s in gum-js-loop gmain gdbus GumScript GDBusProxy 'GLib-GIO' FridaScriptEngine frida Frida; do
            printf "  %-18s %s\n" "$s" "$(strings -a "$AG" | grep -c "$s")"
          done

      - name: ldid 签越狱调试权限(签去特征后的二进制)
        run: |
          brew install ldid || true
          SRV=$(find frida/build -name frida-server -type f | head -1)
          AG=$(find frida/build -name 'frida-agent.dylib' -type f | head -1)
          # server 带越狱调试 entitlements;agent ad-hoc 即可
          ldid -S"${{ github.workspace }}/ent.plist" "$SRV"
          ldid -S "$AG"
          cp "$SRV" "frida-server-ios-${{ github.event.inputs.arch }}"
          cp "$AG" "frida-agent-ios.dylib"
          ls -l "frida-server-ios-${{ github.event.inputs.arch }}" "frida-agent-ios.dylib"
          # 注意:去特征后 server 内部 agent 路径已变为 /usr/lib/frlda/frlda-agent.dylib
          #       部署时把 frida-agent-ios.dylib 放到该路径(或用部署脚本改路径)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: frida-server-ios-${{ github.event.inputs.arch }}
          path: |
            frida-server-ios-${{ github.event.inputs.arch }}
            frida-agent-ios.dylib
