name: build-frida-ios

# 在 GitHub 的 macOS runner(自带 Xcode + iOS SDK)上原生编 iOS 版 frida。
# 手动触发:Actions 页 -> build-frida-ios -> Run workflow。
# 每次构建生成随机别名(postpatch.py),产物命名/内部字符串都带该别名。

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: "frida 版本(要和你主机 client 对齐)"
        default: "16.1.4"
      arch:
        description: "iOS 架构(6s/A9=arm64;A12+=arm64e)"
        default: "arm64e"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout 本仓库(取 ent.plist 与脚本)
        uses: actions/checkout@v4

      - name: 拉取 frida 源码(含子模块)
        run: |
          git clone --recurse-submodules --depth 1 \
            -b "${{ github.event.inputs.frida_version }}" \
            https://github.com/frida/frida.git frida

      - name: 降级 clang16 默认错误(frida16.1.4 是 2023 代码,clang16 把这些当 error)
        run: |
          cd frida
          # setup-env.sh 无 CFLAGS 钩子,直接往 c_like_flags 注入 -Wno-error=*
          perl -0777 -i -pe 's/(c_like_flags=\(\))/$1\nc_like_flags+=("-Wno-error=incompatible-function-pointer-types" "-Wno-error=incompatible-pointer-types" "-Wno-error=int-conversion" "-Wno-error=implicit-function-declaration" "-Wno-error=implicit-int")/' releng/setup-env.sh
          grep -n 'Wno-error' releng/setup-env.sh || (echo "注入失败"; exit 1)

      - name: 反检测源码补丁(frida-gum 入口 redirect 去 br/ldr prologue 特征)
        run: |
          # 治工行/邮储/GCash 等对 frida-core 自身 hook 的 libsystem 函数
          # (task_threads/thread_resume/abort/signal...)做的 prologue 完整性扫描:
          #  16B redirect: ldr x16;br x16(首字节0x58) -> movz/movk x16;br x16(首字节0xd2)
          #  8B  redirect: adrp x16;br x16 -> adrp x16;ret x16(byte6 0x1f->0x5f)
          python3 "${{ github.workspace }}/patch_antidetect.py" frida
          echo "== 确认补丁已应用 =="
          ITC=$(find frida -path '*/gum/backend-arm64/guminterceptor-arm64.c' | head -1)
          grep -q '0xd2800010' "$ITC" || (echo "补丁未生效: $ITC"; exit 1)

      - name: 编译 frida-server 和双架构 agent
        env:
          IOS_CERTID: "-"        # ad-hoc 签名(runner 无 Apple 证书;越狱机可用)
        run: |
          cd frida
          ARCH="${{ github.event.inputs.arch }}"
          case "$ARCH" in arm64|arm64e) ;; *) echo "Unsupported architecture"; exit 1;; esac
          make build/frida-ios-arm64/usr/lib/pkgconfig/frida-core-1.0.pc
          # The custom 48-bit trampoline rewrite drops PAC bits on arm64e.
          # Keep the upstream authenticated trampoline for this architecture.
          git -C frida-gum checkout -- gum/backend-arm64/guminterceptor-arm64.c
          make build/frida-ios-arm64e/usr/lib/pkgconfig/frida-core-1.0.pc
          mkdir -p ../dist
          cp "build/frida-ios-${ARCH}/usr/bin/frida-server" ../dist/server
          lipo -create build/frida-ios-arm64/usr/lib/frida/frida-agent.dylib \
            build/frida-ios-arm64e/usr/lib/frida/frida-agent.dylib -output ../dist/agent.dylib
          lipo -info ../dist/server ../dist/agent.dylib
          echo "== 定位产物 =="
          find build -name frida-server -type f -print
          find build -name 'frida-agent.dylib' -type f -print

      - name: 去特征(随机别名 postpatch + 端口 + LC_ID_DYLIB)
        run: |
          SRV=dist/server
          AG=dist/agent.dylib
          echo "server=$SRV"; echo "agent=$AG"
          [ -n "$SRV" ] && [ -n "$AG" ] || { echo "产物缺失"; exit 1; }

          # 随机别名由 postpatch.py 生成(5 字母数字,等长替换保证 LC_ID_DYLIB 兼容)
          # 用环境变量固定本次构建的别名,供后续步骤读取 manifest
          python3 "${{ github.workspace }}/postpatch.py" "$SRV" "$AG"
          # postpatch 会生成 build_manifest.json,读别名
          ALIAS=$(python3 -c 'import json; print(json.load(open("build_manifest.json"))["alias"])')
          echo "ALIAS=$ALIAS" >> $GITHUB_ENV
          echo "随机别名: $ALIAS"
          echo "== server/agent 特征残留校验(应全 0)=="
          for bin in "$SRV" "$AG"; do
            echo "-- $bin"
            for s in gum-js-loop gmain gdbus GumScript GDBusProxy 'GLib-GIO' FridaScriptEngine frida Frida FRIDA frida-agent.dylib frida-server re.frida.Server frida:rpc; do
              c=$(strings -a "$bin" | grep -F -c "$s" || true)
              printf "  %-22s %s\n" "$s" "$c"
              [ "$c" = "0" ] || { echo "残留 $s in $bin"; exit 1; }
            done
          done

      - name: ldid 签越狱调试权限(签去特征后的二进制)
        run: |
          brew install ldid
          SRV=dist/server
          AG=dist/agent.dylib
          ALIAS="${{ env.ALIAS }}"
          # 用随机别名命名 artifact,避免固定 frlda 被 RASP 长期学习
          cp "$SRV" "${ALIAS}-server-ios-${{ github.event.inputs.arch }}"
          cp "$AG" "${ALIAS}-agent.dylib"
          # 先复制成 alias-* 名字再签名,避免 ldid 把原名作为 identifier 写回。
          ldid -S"${{ github.workspace }}/ent.plist" "${ALIAS}-server-ios-${{ github.event.inputs.arch }}"
          ldid -S "${ALIAS}-agent.dylib"
          # Signing is the final mutation. Keep the first manifest and its alias.
          test "$(python3 -c 'import json; print(json.load(open("build_manifest.json"))["alias"])')" = "$ALIAS"
          echo "== final artifact 特征残留校验(应全 0)=="
          for bin in "${ALIAS}-server-ios-${{ github.event.inputs.arch }}" "${ALIAS}-agent.dylib"; do
            echo "-- $bin"
            python3 -c 'import sys; from pathlib import Path; data=Path(sys.argv[1]).read_bytes(); needles=[b"gum-js-loop",b"gmain",b"gdbus",b"GumScript",b"GDBusProxy",b"GLib-GIO",b"FridaScriptEngine",b"frida-agent.dylib",b"frida-server",b"re.frida.Server",b"frida:rpc",b"frida",b"Frida",b"FRIDA"]; counts=[(s,data.count(s)) for s in needles]; [print("  %-22s %s" % (s.decode("utf-8","replace"), c)) for s,c in counts]; raise SystemExit(1 if any(c for _,c in counts) else 0)' "$bin"
          done
          ls -l "${ALIAS}-server-ios-${{ github.event.inputs.arch }}" "${ALIAS}-agent.dylib"
          # 部署注意:server 内部 agent 路径已变为 /usr/lib/<alias>/<alias>-agent.dylib,
          # 把 agent 放到该路径,进程名保持 <alias>-server。

      - name: 上传产物(含 manifest)
        uses: actions/upload-artifact@v4
        with:
          name: frida-stealth-${{ github.event.inputs.arch }}
          path: |
            *-server-ios-${{ github.event.inputs.arch }}
            *-agent.dylib
            build_manifest.json
